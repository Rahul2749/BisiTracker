services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bisitracker
      POSTGRES_USER: bisi
      POSTGRES_PASSWORD: bisi-local-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - bisi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bisi -d bisitracker"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  bisi-postgres:
